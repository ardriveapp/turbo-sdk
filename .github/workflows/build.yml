name: Build and Test

on:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version: [18.x, 20.x, 22.x, 24.x]
        command: ['lint', 'format', 'build']
    steps:
      - uses: actions/checkout@v4

      - name: Set Up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --immutable --immutable-cache

      - name: Run ${{ matrix.command }}
        run: yarn ${{ matrix.command }}

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set Up node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --immutable --immutable-cache

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests
        run: yarn workspace @ardrive/turbo-sdk test:docker
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          BUNDLER_ARWEAVE_WALLET: ${{ secrets.BUNDLER_ARWEAVE_WALLET }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    # Reads the repository and queries the npm registry; nothing else.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The job installs dependencies, which runs their lifecycle
          # scripts. It needs no token, so do not leave one on disk.
          persist-credentials: false

      - name: Set Up node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --immutable --immutable-cache

      # The packed tarball ships lib/, and the check loads it.
      - name: Build
        run: yarn workspace @ardrive/turbo-sdk build

      - name: Audit and load the packed build
        run: yarn workspace @ardrive/turbo-sdk test:audit
