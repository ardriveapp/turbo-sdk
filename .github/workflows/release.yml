name: Release

# One queue per branch. A merge to main must never cancel an alpha release,
# and a release is never cancelled once it starts: npm publish is not
# atomic with the steps after it, so a cancelled run can leave a version on
# npm with no tag or GitHub release. The next run waits instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - alpha

jobs:
  build:
    # The build.yml at this commit, so each branch releases with its own CI
    # definition. Pinning @alpha ran alpha's jobs against main's code.
    uses: ./.github/workflows/build.yml
    secrets: inherit
  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Up node
        uses: actions/setup-node@v7
        with:
          cache: 'yarn'
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn --immutable --immutable-cache

      - name: Build
        run: yarn workspace @ardrive/turbo-sdk build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn workspace @ardrive/turbo-sdk semantic-release

      - name: Publish Dist Tag
        run: |
          VERSION=$(cat packages/turbo-sdk/package.json | jq -r .version)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: Failed to extract version from package.json"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist
          git reset
          git add packages/turbo-sdk/lib/** packages/turbo-sdk/bundles/** README.md LICENSE.md packages/turbo-sdk/package.json -f
          git commit -m "chore(dist): release version v${VERSION} [skip ci]" --no-verify
          git push origin dist --force
          git tag v${VERSION}-dist --force
          git push origin v${VERSION}-dist --force
