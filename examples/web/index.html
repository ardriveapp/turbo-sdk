<html>
  <head>
    <style>
      body {
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Rates</h1>
      <pre id="rates">Fetching rates...</pre>
    </div>

    <div>
      <h1>Wallet</h1>
      <pre id="address">Generating wallet...</pre>
      <button id="addWalletFromFile">Add Wallet from File</button>
    </div>

    <div>
      <h1>Balance</h1>
      <pre id="balance">Fetching balance for generated wallet...</pre>
    </div>

    <div>
      <h1>Upload File</h1>

      <form id="uploadForm">
        <label for="file">Choose file to upload:</label>
        <input type="file" id="file" name="file" />
        <br /><br />
        <button type="submit">Upload File</button>
        <br /><br />
        <pre id="uploadStatus"></pre>
      </form>
    </div>

    <script type="module">
      // import Arweave from 'arweave';
      import {
        TurboFactory,
        developmentTurboConfiguration,
      } from '../../packages/turbo-sdk/bundles/web.bundle.min.js';

      TurboFactory.setLogLevel('debug');

      const ratesEl = document.getElementById('rates');
      const balanceEl = document.getElementById('balance');
      const uploadStatusEl = document.getElementById('uploadStatus');
      const uploadForm = document.getElementById('uploadForm');
      const fileInput = document.getElementById('file');
      const addressEl = document.getElementById('address');

      const arweave = Arweave.init({
        host: 'ar-io.dev',
        port: 443,
        protocol: 'https',
      });

      const jwk = await arweave.crypto.generateJWK();
      const address = await arweave.wallets.jwkToAddress(jwk);
      addressEl.innerText = address;

      let turbo = TurboFactory.authenticated({
        privateKey: jwk,
        ...developmentTurboConfiguration,
      });

      try {
        const rates = await turbo.getFiatRates();

        console.log('Successfully fetched rates!', rates);

        ratesEl.innerText = Object.entries(rates.fiat)
          .map(([key, value]) => `${key}: ${value}`)
          .join('\n');
      } catch (err) {
        console.error('Error fetching rates!', err);
        ratesEl.innerText = `Error fetching rates: ${err.message ?? err}`;
      }

      try {
        const balance = await turbo.getBalance();

        console.log('Successfully fetched balance!', balance);

        balanceEl.innerText = JSON.stringify(balance, null, 2);
      } catch (err) {
        console.error('Error fetching balance!', err);
        balanceEl.innerText = `Error fetching balance: ${err.message ?? err}`;
      }

      const addWalletFromFileButton =
        document.getElementById('addWalletFromFile');
      addWalletFromFileButton.addEventListener('click', async () => {
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.json';
        fileInput.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          try {
            const fileContent = await file.text();
            const jwkFromFile = JSON.parse(fileContent);
            turbo = TurboFactory.authenticated({
              privateKey: jwkFromFile,
              ...developmentTurboConfiguration,
            });
            addressEl.innerText =
              await arweave.wallets.jwkToAddress(jwkFromFile);
            balanceEl.innerText = 'Fetching balance for new wallet...';
            const balance = await turbo.getBalance();
            balanceEl.innerText = JSON.stringify(balance, null, 2);
          } catch (err) {
            console.error('Error adding wallet from file!', err);
            alert(`Error adding wallet from file: ${err.message ?? err}`);
          }
        };
        fileInput.click();
      });

      uploadForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const selectedFiles = fileInput.files;

        if (!selectedFiles.length) {
          uploadStatusEl.innerText = 'No file selected';
          return;
        }

        uploadStatusEl.innerText = 'Uploading...';

        try {
          for (const file of selectedFiles) {
            const res = await turbo.uploadFile({
              fileStreamFactory: () => file.stream(),
              fileSizeFactory: () => file.size,
            });

            console.log('Successfully uploaded file!', res);

            uploadStatusEl.innerText = `Successfully uploaded file!\n${JSON.stringify(
              res,
              null,
              2,
            )}`;
          }
        } catch (err) {
          console.error('Error uploading file!', err);
          uploadStatusEl.innerText = `Error uploading file: ${
            err.message ?? err
          }`;
        }
      });
    </script>
  </body>
</html>
